syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "ServiceC";

package weather;

service Weather {
  rpc SetWeather (Request) returns (Response);
}

message Request {
	float temperature = 1;
	int32 humidity = 2;
	string description = 3;
	google.protobuf.Timestamp time = 4;
}

message Response {
	bool success = 1;
}
